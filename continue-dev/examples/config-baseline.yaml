# Continue.dev — BASELINE configuration
# Essential security only. All context providers enabled, public API endpoints.
# Suitable for startups and individual developers.

schema: v1

models:
  - name: "default"
    provider: "openai"
    model: "gpt-4o"
    apiKey: "${{ secrets.OPENAI_API_KEY }}"
    requestOptions:
      timeout: 60

tabAutocompleteModel:
  provider: "openai"
  model: "gpt-4o-mini"
  apiKey: "${{ secrets.OPENAI_API_KEY }}"

embeddingsProvider:
  provider: "openai"
  model: "text-embedding-3-small"
  apiKey: "${{ secrets.OPENAI_API_KEY }}"

contextProviders:
  - name: "code"
  - name: "docs"
  - name: "diff"
  - name: "terminal"
  - name: "tree"
  - name: "codebase"
  - name: "web"

# WHAT: Approved MCP servers that Continue can launch as tools.
# WHY: Baseline keeps the default config empty but gives admins the correct
#      place to add reviewed MCP servers when a team needs tool integrations.
# BREAKS IF REMOVED: MCP may be configured elsewhere without review, making it
#      harder to audit which tool servers developers can use.
mcpServers: []

allowAnonymousTelemetry: false
disableIndexing: false
