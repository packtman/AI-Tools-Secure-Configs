# Continue.dev — BASELINE configuration
# Essential security only. All context providers enabled, public API endpoints.
# Suitable for startups and individual developers.

name: Baseline Continue.dev configuration
version: 1.0.0
schema: v1

models:
  - name: "default"
    provider: "openai"
    model: "gpt-4o"
    apiKey: "${{ secrets.OPENAI_API_KEY }}"
    requestOptions:
      timeout: 60

tabAutocompleteModel:
  provider: "openai"
  model: "gpt-4o-mini"
  apiKey: "${{ secrets.OPENAI_API_KEY }}"

embeddingsProvider:
  provider: "openai"
  model: "text-embedding-3-small"
  apiKey: "${{ secrets.OPENAI_API_KEY }}"

contextProviders:
  - name: "code"
  - name: "docs"
  - name: "diff"
  - name: "terminal"
  - name: "tree"
  - name: "codebase"
  - name: "web"

# WHAT: Defines MCP servers available to Continue agents.
# WHY: Baseline defaults to none so teams consciously opt in to servers that
# execute external tools.
# BREAKS IF REMOVED: Users may not notice that MCP is unset and may add
# unreviewed servers locally.
mcpServers: []

allowAnonymousTelemetry: false
disableIndexing: false
