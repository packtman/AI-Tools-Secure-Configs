# Continue.dev: Enterprise configuration (Moderate-equivalent)
# Includes proxy settings and private model endpoints.
# Pair with permissions-moderate.yaml and Mission Control org secrets.

name: "secure-enterprise-config"
version: "1.1.0"
schema: v1

models:
  - name: "corporate-llm"
    provider: "openai"
    model: "gpt-4o"
    apiBase: "https://llm-gateway.corp.example.com/v1"
    apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"
    requestOptions:
      timeout: 30
      extraHeaders:
        X-Corp-Team: "engineering"
        X-Corp-Env: "production"
      proxy: "https://proxy.corp.example.com:8443"
      verifySsl: true

tabAutocompleteModel:
  provider: "openai"
  model: "gpt-4o-mini"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

embeddingsProvider:
  provider: "openai"
  model: "text-embedding-3-small"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

contextProviders:
  - name: "code"
  - name: "docs"
  - name: "diff"
  - name: "tree"
  - name: "codebase"

# WHAT: Empty MCP default for enterprise endpoints.
# WHY: MCP must be allowlisted through change control, not shipped open.
# BREAKS: Removing the key hides whether MCP is intentionally denied.
mcpServers: []

allowAnonymousTelemetry: false
disableIndexing: false
