# Continue.dev: MODERATE configuration
# Balanced security with developer productivity. Codebase indexing enabled,
# empty default MCP list (add only allowlisted org servers), proxy required.
# Use for standard enterprise teams. Pair with permissions-moderate.yaml.

# WHAT: Required config identity metadata for Continue schema v1.
# WHY: Current Continue configs require name, version, and schema.
# BREAKS: Omitting these can cause config load failures or silent fallback.
name: "secure-moderate-config"
version: "1.1.0"
schema: v1

models:
  - name: "corporate-llm"
    provider: "openai"
    model: "gpt-4o"
    apiBase: "https://llm-gateway.corp.example.com/v1"
    apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"
    requestOptions:
      timeout: 30
      proxy: "https://proxy.corp.example.com:8443"
      verifySsl: true

tabAutocompleteModel:
  provider: "openai"
  model: "gpt-4o-mini"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

embeddingsProvider:
  provider: "openai"
  model: "text-embedding-3-small"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

contextProviders:
  - name: "code"
  - name: "docs"
  - name: "diff"
  - name: "terminal"
  - name: "tree"
  - name: "codebase"

# WHAT: Default deny for MCP servers; admins add named allowlisted entries only.
# WHY: Moderate treats MCP as an exception path, not a default capability.
# BREAKS: Populating this without review exposes agent tools to third-party servers.
mcpServers: []

allowAnonymousTelemetry: false
disableIndexing: false
