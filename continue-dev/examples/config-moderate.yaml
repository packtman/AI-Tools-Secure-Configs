# Continue.dev — MODERATE configuration
# Balanced security with developer productivity. Codebase indexing enabled,
# reasonable context providers. Use for standard enterprise teams.

name: Moderate Continue.dev configuration
version: 1.0.0
schema: v1

models:
  - name: "corporate-llm"
    provider: "openai"
    model: "gpt-4o"
    apiBase: "https://llm-gateway.corp.example.com/v1"
    apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"
    requestOptions:
      timeout: 30
      proxy: "https://proxy.corp.example.com:8443"
      verifySsl: true

tabAutocompleteModel:
  provider: "openai"
  model: "gpt-4o-mini"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

embeddingsProvider:
  provider: "openai"
  model: "text-embedding-3-small"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

contextProviders:
  - name: "code"
  - name: "docs"
  - name: "diff"
  - name: "terminal"
  - name: "tree"
  - name: "codebase"

# WHAT: Defines MCP servers available to Continue agents.
# WHY: Moderate keeps this empty until IT approves server packages, credentials,
# and network scope.
# BREAKS IF REMOVED: Developers may add local MCP servers outside the rollout
# review path.
mcpServers: []

allowAnonymousTelemetry: false
disableIndexing: false
