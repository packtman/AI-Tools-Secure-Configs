# Continue.dev — MODERATE configuration
# Balanced security with developer productivity. Codebase indexing enabled,
# reasonable context providers. Use for standard enterprise teams.

# WHAT: Human-readable config identity required by the current Continue config spec.
# WHY: Moderate examples should be directly importable by standard enterprise teams.
# BREAKS IF REMOVED: Continue may reject the config or show an unnamed config.
name: "Corporate Moderate"
version: "1.0.0"
schema: v1

models:
  - name: "corporate-llm"
    provider: "openai"
    model: "gpt-4o"
    apiBase: "https://llm-gateway.corp.example.com/v1"
    apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"
    requestOptions:
      timeout: 30
      proxy: "https://proxy.corp.example.com:8443"
      verifySsl: true

tabAutocompleteModel:
  provider: "openai"
  model: "gpt-4o-mini"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

embeddingsProvider:
  provider: "openai"
  model: "text-embedding-3-small"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

contextProviders:
  - name: "code"
  - name: "docs"
  - name: "diff"
  - name: "terminal"
  - name: "tree"
  - name: "codebase"

# WHAT: Explicit MCP server inventory.
# WHY: Moderate tier requires MCP servers to be reviewed before rollout.
# BREAKS IF REMOVED: Local or team configs may add external tools without admin review.
mcpServers: []

allowAnonymousTelemetry: false
disableIndexing: false
