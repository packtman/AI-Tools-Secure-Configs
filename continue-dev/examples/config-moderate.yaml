# Continue.dev — MODERATE configuration
# Balanced security with developer productivity. Codebase indexing enabled,
# reasonable context providers. Use for standard enterprise teams.

schema: v1

models:
  - name: "corporate-llm"
    provider: "openai"
    model: "gpt-4o"
    apiBase: "https://llm-gateway.corp.example.com/v1"
    apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"
    requestOptions:
      timeout: 30
      proxy: "https://proxy.corp.example.com:8443"
      verifySsl: true

tabAutocompleteModel:
  provider: "openai"
  model: "gpt-4o-mini"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

embeddingsProvider:
  provider: "openai"
  model: "text-embedding-3-small"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

contextProviders:
  - name: "code"
  - name: "docs"
  - name: "diff"
  - name: "terminal"
  - name: "tree"
  - name: "codebase"

# WHAT: Approved MCP servers that Continue can launch as tools.
# WHY: Moderate tier requires an explicit reviewed list. Add only pinned,
#      least-privilege servers with documented owner, scopes, and logging.
# BREAKS IF REMOVED: Teams may assume ad hoc project MCP servers are acceptable,
#      creating unmanaged filesystem, shell, or API access.
mcpServers: []

allowAnonymousTelemetry: false
disableIndexing: false
