# Continue.dev — STRICT configuration
# Maximum restrictions. Read-only tools only, bash disabled, telemetry off.
# Use for regulated environments where AI autonomy must be minimized.

schema: v1

models:
  - name: "corporate-llm"
    provider: "openai"
    model: "gpt-4o"
    apiBase: "https://llm-gateway.corp.example.com/v1"
    apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"
    requestOptions:
      timeout: 30
      proxy: "https://proxy.corp.example.com:8443"
      verifySsl: true

tabAutocompleteModel:
  provider: "openai"
  model: "gpt-4o-mini"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

embeddingsProvider:
  provider: "openai"
  model: "text-embedding-3-small"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

contextProviders:
  - name: "code"
  - name: "diff"
  - name: "tree"

# WHAT: Declares that no MCP servers are approved in this Strict template.
# WHY: MCP servers can add filesystem, network, database, or shell tools. Strict
# environments should start with zero external tool integrations.
# BREAKS IF POPULATED: Any listed server expands the agent's tool surface and must
# be separately audited, pinned, scoped, and monitored before rollout.
mcpServers: []

allowAnonymousTelemetry: false
disableIndexing: true
