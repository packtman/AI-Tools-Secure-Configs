# Continue.dev: STRICT configuration
# Maximum restrictions. Read-only tools only (see permissions-strict.yaml),
# empty MCP list, telemetry off, indexing disabled.
# Use for regulated environments where AI autonomy must be minimized.

# WHAT: Required config identity metadata for Continue schema v1.
# WHY: Current Continue configs require name, version, and schema.
# BREAKS: Omitting these can cause config load failures or silent fallback.
name: "secure-strict-config"
version: "1.1.0"
schema: v1

models:
  - name: "corporate-llm"
    provider: "openai"
    model: "gpt-4o"
    apiBase: "https://llm-gateway.corp.example.com/v1"
    # WHAT: Secret reference, never an inline API key.
    # WHY: Strict forbids secrets in repo-deployed configs.
    # BREAKS: Inlining keys exposes credentials in MDM/Git.
    apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"
    requestOptions:
      timeout: 30
      proxy: "https://proxy.corp.example.com:8443"
      verifySsl: true

tabAutocompleteModel:
  provider: "openai"
  model: "gpt-4o-mini"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

embeddingsProvider:
  provider: "openai"
  model: "text-embedding-3-small"
  apiBase: "https://llm-gateway.corp.example.com/v1"
  apiKey: "${{ secrets.CORPORATE_LLM_KEY }}"

contextProviders:
  - name: "code"
  - name: "diff"
  - name: "tree"

# WHAT: Explicit empty MCP server list for Continue agents.
# WHY: Strict forbids MCP tool bridges unless change-controlled later.
# BREAKS: Removing this hides MCP posture; adding servers is a tier change.
mcpServers: []

allowAnonymousTelemetry: false
disableIndexing: true
