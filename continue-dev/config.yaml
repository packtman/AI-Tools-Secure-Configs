# Continue.dev — Secure global configuration
# Deploy to: ~/.continue/config.yaml
# For enterprise, manage configs via Mission Control (formerly Hub)
# with Organization-level visibility for team-wide enforcement.

name: "secure-enterprise-config"
version: "1.0.0"
schema: v1

# Model configuration — use environment variables or org secrets, NEVER inline keys.
# Reference secrets with mustache notation: ${{ secrets.SECRET_NAME }}
models:
  - name: "default"
    provider: "openai"
    model: "gpt-4o"
    apiKey: "${{ secrets.OPENAI_API_KEY }}"
    requestOptions:
      timeout: 30
      headers:
        X-Request-Source: "continue-dev"

# Tab autocomplete model
tabAutocompleteModel:
  provider: "openai"
  model: "gpt-4o-mini"
  apiKey: "${{ secrets.OPENAI_API_KEY }}"

# Embeddings for @codebase indexing
embeddingsProvider:
  provider: "openai"
  model: "text-embedding-3-small"
  apiKey: "${{ secrets.OPENAI_API_KEY }}"

# Context providers — limit to safe, read-only providers
contextProviders:
  - name: "code"
  - name: "docs"
  - name: "diff"
  - name: "terminal"
  - name: "tree"
  - name: "codebase"

# MCP servers — only approved servers with explicit environment secrets.
# MCP tools are only available in agent mode.
# For enterprise: use org secrets for API keys, never user-level secrets for shared servers.
mcpServers: []

# Disable telemetry
allowAnonymousTelemetry: false

# Indexing enabled for codebase search; set to true for untrusted codebases
disableIndexing: false
