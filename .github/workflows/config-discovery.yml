name: Config Discovery

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force_agent_review:
        description: "Run the config-maintenance agent even when no upstream fingerprint changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: config-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Maintain upstream config coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare discovery branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BRANCH: automation/config-maintenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${BASE_BRANCH}"
          if git ls-remote --exit-code --heads origin "${PR_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${PR_BRANCH}"
          fi
          git checkout -B "${PR_BRANCH}" "origin/${BASE_BRANCH}"

      - name: Install validation tools
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml toml
          python3 -m pip install --user yamllint || true

      - name: Run config discovery
        id: discovery
        env:
          FORCE_AGENT_REVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.force_agent_review }}
        run: |
          set -euo pipefail
          python3 automation/config-discovery/discover_configs.py \
            --sources automation/config-discovery/tool-sources.json \
            --state automation/config-discovery/state/source-snapshots.json \
            --report automation/config-discovery/reports/latest-config-discovery.md

          python3 automation/config-discovery/build_agent_scope.py \
            --report automation/config-discovery/reports/latest-config-discovery.md \
            --output automation/config-discovery/reports/agent-scope.md \
            --max-tools 4

          git add \
            automation/config-discovery/state/source-snapshots.json \
            automation/config-discovery/reports/latest-config-discovery.md \
            automation/config-discovery/reports/agent-scope.md

          if git diff --cached --quiet; then
            echo "discovery_changed=false" >> "${GITHUB_OUTPUT}"
            echo "No discovery changes to commit."
            if [ "${FORCE_AGENT_REVIEW}" = "true" ]; then
              echo "run_agent=true" >> "${GITHUB_OUTPUT}"
              echo "Force agent review requested."
            else
              echo "run_agent=false" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "discovery_changed=true" >> "${GITHUB_OUTPUT}"
            echo "run_agent=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit discovery signal
        if: steps.discovery.outputs.discovery_changed == 'true'
        env:
          PR_BRANCH: automation/config-maintenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update config discovery source snapshots"
          git push --force-with-lease -u origin "${PR_BRANCH}"

      - name: Verify Claude API key
        if: steps.discovery.outputs.run_agent == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is missing, empty, or unavailable to this workflow."
            exit 1
          fi

      - name: Run config maintenance agent
        id: agent
        if: steps.discovery.outputs.run_agent == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are maintaining this repository's hardened AI tool configs.

            Read and follow `automation/config-discovery/agent-prompt.md`.
            Read `automation/config-discovery/reports/agent-scope.md` first (your work list for this run).
            Use `automation/config-discovery/reports/latest-config-discovery.md` only for details on scoped tools.

            Goal: apply focused config updates for scoped tools only, then stop.

            Required behavior:
            1. Process only tools listed in `agent-scope.md`. Do not review all 14 tools in one run.
            2. For each real admin or security control, update **strict, moderate, and baseline** tier files with tier-appropriate values.
            3. Update rationale, README tables, rollout tier deltas, and `tool-sources.json` tier_files when you add paths.
            4. If no config update is needed for a scoped tool, add a concise "No config update needed" note to the discovery report.
            5. Keep deployable JSON valid. Use JSONC plus `.comments.md` where comments are needed.
            6. Do not include secrets, tokens, org IDs, tenant IDs, team IDs, or production hostnames.
            7. Do not use em dash characters in prose or comments.
            8. Validate every edited JSON, YAML, and TOML using AGENTS.md commands before finishing.

            Leave file changes unstaged. The workflow commits after you finish.
          claude_args: |
            --max-turns 60
            --model claude-sonnet-4-20250514
            --allowedTools "Read,Edit,Write,MultiEdit,WebFetch,Bash(git diff *),Bash(git status *),Bash(python3 *),Bash(yamllint *),Bash(bash -n *)"

      - name: Commit agent changes
        if: steps.discovery.outputs.run_agent == 'true' && (steps.agent.outcome == 'success' || steps.agent.outcome == 'failure')
        id: agent-changes
        env:
          PR_BRANCH: automation/config-maintenance
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "agent_changed=false" >> "${GITHUB_OUTPUT}"
            echo "Config maintenance agent made no file changes."
            if [ "${AGENT_OUTCOME}" = "failure" ]; then
              echo "::error::Agent step failed (often error_max_turns). See the Claude Code action log. Re-run with workflow_dispatch or reduce scope in agent-scope.md."
              exit 1
            fi
            exit 0
          fi

          git add .
          if [ "${AGENT_OUTCOME}" = "failure" ]; then
            git commit -m "Apply partial config maintenance updates (agent hit turn limit)"
          else
            git commit -m "Apply config maintenance updates"
          fi
          git push --force-with-lease -u origin "${PR_BRANCH}"
          echo "agent_changed=true" >> "${GITHUB_OUTPUT}"

      - name: Fail if agent errored with no usable diff
        if: steps.discovery.outputs.run_agent == 'true' && steps.agent.outcome == 'failure' && steps.agent-changes.outputs.agent_changed != 'true'
        run: |
          echo "::error::Config maintenance agent failed before producing file changes. Typical cause: error_max_turns (task too large for one run). Check agent-scope.md limits and re-run."
          exit 1

      - name: Open or update pull request
        if: steps.discovery.outputs.discovery_changed == 'true' || steps.agent-changes.outputs.agent_changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: automation/config-maintenance
          AGENT_CHANGED: ${{ steps.agent-changes.outputs.agent_changed }}
        run: |
          set -euo pipefail

          cat > pr-body.md <<'PR_BODY'
          ## Automated config maintenance update

          The scheduled config discovery workflow detected changes in one or more watched upstream sources, then ran the config-maintenance agent against the generated report.

          Review:

          - `automation/config-discovery/reports/latest-config-discovery.md`
          - `automation/config-discovery/reports/agent-scope.md`
          - `automation/config-discovery/agent-prompt.md`

          Expected reviewer checks:

          1. Confirm any config changes are scoped to real admin or security controls.
          2. Confirm no secrets, tokens, org IDs, tenant IDs, team IDs, or production hostnames were added.
          3. Confirm deployable JSON remains valid and rationale lives in JSONC or `.comments.md` where needed.
          4. Confirm the update stayed within the scoped tool list unless the report required a direct cross-tool rollout note.
          5. Confirm rollout impact, deployment steps, audit logging, rollback, and workflow-preservation notes are updated when behavior changes.

          If this PR contains only discovery snapshot/report changes, the report should include a "No config update needed" explanation for each changed source.
          PR_BODY

          if [ "${AGENT_CHANGED:-false}" = "true" ]; then
            TITLE="Config maintenance: apply upstream config updates"
          else
            TITLE="Config maintenance: upstream changes reviewed"
          fi

          OPEN_PR="$(gh pr list --head "${PR_BRANCH}" --state open --json number --jq '.[0].number // empty')"

          if [ -n "${OPEN_PR}" ]; then
            gh pr edit "${OPEN_PR}" \
              --title "${TITLE}" \
              --body-file pr-body.md
          else
            gh pr create \
              --base "${BASE_BRANCH}" \
              --head "${PR_BRANCH}" \
              --title "${TITLE}" \
              --body-file pr-body.md
          fi
