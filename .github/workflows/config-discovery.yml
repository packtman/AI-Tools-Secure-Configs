name: Config Discovery

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      run_config_agent:
        description: "Run the config-maintenance agent (uses API credits; discovery always runs)"
        required: false
        default: false
        type: boolean
      force_agent_review:
        description: "Deprecated alias for run_config_agent when content-level changes exist"
        required: false
        default: false
        type: boolean

env:
  # Fallback caps if dynamic sizing is disabled (see COST-CONTROLS.md)
  CONFIG_AGENT_MAX_BUDGET_USD: "12.00"
  CONFIG_AGENT_MAX_TURNS: "80"
  CONFIG_AGENT_MAX_SOURCES: "0"
  CONFIG_AGENT_BUDGET_CEILING_USD: "15.00"
  # Scheduled runs only fingerprint upstream sources; they do not call the model.
  CONFIG_AGENT_ON_SCHEDULE: "false"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: config-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Maintain upstream config coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare discovery branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BRANCH: automation/config-maintenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${BASE_BRANCH}"
          if git ls-remote --exit-code --heads origin "${PR_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${PR_BRANCH}"
          fi
          git checkout -B "${PR_BRANCH}" "origin/${BASE_BRANCH}"

      - name: Run config discovery
        id: discovery
        env:
          RUN_CONFIG_AGENT: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_config_agent || inputs.force_agent_review) }}
          FORCE_AGENT_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.force_agent_review }}
          AGENT_ON_SCHEDULE: ${{ vars.CONFIG_AGENT_ON_SCHEDULE || env.CONFIG_AGENT_ON_SCHEDULE }}
          MAX_AGENT_SOURCES: ${{ vars.CONFIG_AGENT_MAX_SOURCES || env.CONFIG_AGENT_MAX_SOURCES }}
        run: |
          set -euo pipefail
          SUMMARY_PATH="automation/config-discovery/reports/discovery-summary.json"

          python3 automation/config-discovery/discover_configs.py \
            --sources automation/config-discovery/tool-sources.json \
            --state automation/config-discovery/state/source-snapshots.json \
            --report automation/config-discovery/reports/latest-config-discovery.md \
            --summary "${SUMMARY_PATH}" \
            --max-agent-sources "${MAX_AGENT_SOURCES}"

          AGENT_WORTHY_COUNT="$(python3 -c "import json; print(json.load(open('${SUMMARY_PATH}'))['agent_worthy_count'])")"
          echo "agent_worthy_count=${AGENT_WORTHY_COUNT}" >> "${GITHUB_OUTPUT}"

          git add \
            automation/config-discovery/state/source-snapshots.json \
            automation/config-discovery/reports/latest-config-discovery.md \
            "${SUMMARY_PATH}"

          if git diff --cached --quiet; then
            echo "discovery_changed=false" >> "${GITHUB_OUTPUT}"
            echo "No discovery changes to commit."
          else
            echo "discovery_changed=true" >> "${GITHUB_OUTPUT}"
          fi

          WANT_AGENT="false"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${AGENT_ON_SCHEDULE}" = "true" ] && [ "${AGENT_WORTHY_COUNT}" -gt 0 ]; then
              WANT_AGENT="true"
            fi
          elif [ "${RUN_CONFIG_AGENT}" = "true" ] && [ "${AGENT_WORTHY_COUNT}" -gt 0 ]; then
            WANT_AGENT="true"
          elif [ "${RUN_CONFIG_AGENT}" = "true" ] || [ "${FORCE_AGENT_REQUESTED}" = "true" ]; then
            echo "::warning::Agent was requested, but no content-level upstream changes were detected. Skipping to avoid API spend."
          fi

          if [ "${WANT_AGENT}" = "true" ]; then
            echo "run_agent=true" >> "${GITHUB_OUTPUT}"
            QUEUED="$(python3 -c "import json; print(json.load(open('${SUMMARY_PATH}'))['agent_queue_count'])")"
            if [ "${MAX_AGENT_SOURCES}" = "0" ] || [ -z "${MAX_AGENT_SOURCES}" ]; then
              echo "Config agent will review all ${QUEUED} queued source(s)."
            else
              echo "Config agent will review up to ${QUEUED} queued source(s) (cap: ${MAX_AGENT_SOURCES})."
            fi
          else
            echo "run_agent=false" >> "${GITHUB_OUTPUT}"
            if [ "${AGENT_WORTHY_COUNT}" -gt 0 ] && [ "${{ github.event_name }}" = "schedule" ]; then
              echo "Content changes detected; scheduled run is discovery-only. Re-run workflow manually with run_config_agent enabled."
            elif [ "${AGENT_WORTHY_COUNT}" -eq 0 ]; then
              echo "No content-level upstream changes; discovery-only run."
            fi
          fi

      - name: Commit discovery signal
        if: steps.discovery.outputs.discovery_changed == 'true'
        env:
          PR_BRANCH: automation/config-maintenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update config discovery source snapshots"
          git push --force-with-lease -u origin "${PR_BRANCH}"

      - name: Verify Claude API key
        if: steps.discovery.outputs.run_agent == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is missing, empty, or unavailable to this workflow."
            exit 1
          fi

      - name: Set agent limits from queue size
        if: steps.discovery.outputs.run_agent == 'true'
        env:
          BUDGET_CEILING: ${{ vars.CONFIG_AGENT_BUDGET_CEILING_USD || env.CONFIG_AGENT_BUDGET_CEILING_USD }}
          STATIC_BUDGET: ${{ vars.CONFIG_AGENT_MAX_BUDGET_USD || env.CONFIG_AGENT_MAX_BUDGET_USD }}
          STATIC_TURNS: ${{ vars.CONFIG_AGENT_MAX_TURNS || env.CONFIG_AGENT_MAX_TURNS }}
          USE_STATIC_LIMITS: ${{ vars.CONFIG_AGENT_STATIC_LIMITS || 'false' }}
        run: |
          set -euo pipefail
          if [ "${USE_STATIC_LIMITS}" = "true" ]; then
            echo "AGENT_MAX_BUDGET_USD=${STATIC_BUDGET}" >> "${GITHUB_ENV}"
            echo "AGENT_MAX_TURNS=${STATIC_TURNS}" >> "${GITHUB_ENV}"
          else
            python3 automation/config-discovery/compute_agent_limits.py \
              --summary automation/config-discovery/reports/discovery-summary.json \
              --ceiling-usd "${BUDGET_CEILING}" >> "${GITHUB_ENV}"
          fi
          echo "::notice::Agent run ceiling: \$${AGENT_MAX_BUDGET_USD} and ${AGENT_MAX_TURNS} turns for ${AGENT_QUEUE_COUNT:-?} source(s). See COST-CONTROLS.md."

      - name: Run config maintenance agent
        if: steps.discovery.outputs.run_agent == 'true'
        continue-on-error: true
        id: config-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are maintaining this repository's hardened AI tool configs.

            Read `automation/config-discovery/reports/discovery-summary.json` first.
            Read `automation/config-discovery/reports/latest-config-discovery.md`.
            Use only the "## Agent review queue" section. Do not read full tool trees unless editing a specific file.

            Requirements:
            1. Process every source in the Agent review queue, in order, before finishing.
            2. Do not WebFetch or browse the web. Use keyword snippets and missing-term lists already in the report.
            3. If snippets are enough to conclude "No config update needed", add that note for that source and continue to the next.
            4. Prefer the smallest diff: one tool directory, only tiers that need a new or changed control.
            5. Do not regenerate rollout guides unless a setting meaningfully changed for admins.
            6. Validate only files you edited (python3 JSON check, yamllint, bash -n per AGENTS.md).

            Leave file changes unstaged. The workflow commits after you finish.
          claude_args: |
            --max-turns ${{ env.AGENT_MAX_TURNS }}
            --max-budget-usd ${{ env.AGENT_MAX_BUDGET_USD }}
            --model claude-sonnet-4-20250514
            --allowedTools "Read,Edit,Write,MultiEdit,Glob,Grep,Bash(git diff *),Bash(git status *),Bash(python3 *),Bash(yamllint *),Bash(bash -n *)"

      - name: Note config agent failure
        if: steps.discovery.outputs.run_agent == 'true' && steps.config-agent.outcome == 'failure'
        run: |
          echo "::warning::Config maintenance agent failed (for example max turns). Committing any partial file changes."

      - name: Commit agent changes
        if: steps.discovery.outputs.run_agent == 'true' && steps.config-agent.outcome != 'skipped'
        id: agent-changes
        env:
          PR_BRANCH: automation/config-maintenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "agent_changed=false" >> "${GITHUB_OUTPUT}"
            echo "Config maintenance agent made no file changes."
            exit 0
          fi

          git add .
          git commit -m "Apply config maintenance updates"
          git push --force-with-lease -u origin "${PR_BRANCH}"
          echo "agent_changed=true" >> "${GITHUB_OUTPUT}"

      - name: Open or update pull request
        if: steps.discovery.outputs.discovery_changed == 'true' || steps.agent-changes.outputs.agent_changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: automation/config-maintenance
          AGENT_CHANGED: ${{ steps.agent-changes.outputs.agent_changed }}
        run: |
          set -euo pipefail

          cat > pr-body.md <<'PR_BODY'
          ## Automated config maintenance update

          The scheduled config discovery workflow detected changes in one or more watched upstream sources, then ran the config-maintenance agent against the generated report.

          Review:

          - `automation/config-discovery/reports/latest-config-discovery.md`
          - `automation/config-discovery/agent-prompt.md`

          Expected reviewer checks:

          1. Confirm any config changes are scoped to real admin or security controls.
          2. Confirm no secrets, tokens, org IDs, tenant IDs, team IDs, or production hostnames were added.
          3. Confirm deployable JSON remains valid and rationale lives in JSONC or `.comments.md` where needed.
          4. Confirm rollout impact, deployment steps, audit logging, rollback, and workflow-preservation notes are updated when behavior changes.

          If this PR contains only discovery snapshot/report changes, the report should include a "No config update needed" explanation for each changed source.
          PR_BODY

          if [ "${AGENT_CHANGED:-false}" = "true" ]; then
            TITLE="Config maintenance: apply upstream config updates"
          else
            TITLE="Config maintenance: upstream changes reviewed"
          fi

          OPEN_PR="$(gh pr list --head "${PR_BRANCH}" --state open --json number --jq '.[0].number // empty')"

          if [ -n "${OPEN_PR}" ]; then
            gh pr edit "${OPEN_PR}" \
              --title "${TITLE}" \
              --body-file pr-body.md
          else
            gh pr create \
              --base "${BASE_BRANCH}" \
              --head "${PR_BRANCH}" \
              --title "${TITLE}" \
              --body-file pr-body.md
          fi
