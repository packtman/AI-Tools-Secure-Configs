name: Config Discovery

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force_agent_review:
        description: "Run the config-maintenance agent even when no upstream fingerprint changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: config-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Maintain upstream config coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare discovery branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BRANCH: automation/config-maintenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${BASE_BRANCH}"
          if git ls-remote --exit-code --heads origin "${PR_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${PR_BRANCH}"
          fi
          git checkout -B "${PR_BRANCH}" "origin/${BASE_BRANCH}"

      - name: Run config discovery
        id: discovery
        env:
          FORCE_AGENT_REVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.force_agent_review }}
        run: |
          set -euo pipefail
          SUMMARY_PATH="automation/config-discovery/reports/discovery-summary.json"

          python3 automation/config-discovery/discover_configs.py \
            --sources automation/config-discovery/tool-sources.json \
            --state automation/config-discovery/state/source-snapshots.json \
            --report automation/config-discovery/reports/latest-config-discovery.md \
            --summary "${SUMMARY_PATH}"

          AGENT_WORTHY_COUNT="$(python3 -c "import json; print(json.load(open('${SUMMARY_PATH}'))['agent_worthy_count'])")"
          echo "agent_worthy_count=${AGENT_WORTHY_COUNT}" >> "${GITHUB_OUTPUT}"

          git add \
            automation/config-discovery/state/source-snapshots.json \
            automation/config-discovery/reports/latest-config-discovery.md \
            "${SUMMARY_PATH}"

          if git diff --cached --quiet; then
            echo "discovery_changed=false" >> "${GITHUB_OUTPUT}"
            echo "No discovery changes to commit."
          else
            echo "discovery_changed=true" >> "${GITHUB_OUTPUT}"
          fi

          if [ "${AGENT_WORTHY_COUNT}" -gt 0 ]; then
            echo "run_agent=true" >> "${GITHUB_OUTPUT}"
            echo "Config agent will review ${AGENT_WORTHY_COUNT} upstream source(s)."
          elif [ "${FORCE_AGENT_REVIEW}" = "true" ]; then
            echo "run_agent=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::force_agent_review was set, but no content-level upstream changes were detected. Skipping agent to avoid expensive no-op runs."
          else
            echo "run_agent=false" >> "${GITHUB_OUTPUT}"
            echo "Only metadata-only discovery changes; skipping config agent."
          fi

      - name: Commit discovery signal
        if: steps.discovery.outputs.discovery_changed == 'true'
        env:
          PR_BRANCH: automation/config-maintenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update config discovery source snapshots"
          git push --force-with-lease -u origin "${PR_BRANCH}"

      - name: Verify Claude API key
        if: steps.discovery.outputs.run_agent == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is missing, empty, or unavailable to this workflow."
            exit 1
          fi

      - name: Run config maintenance agent
        if: steps.discovery.outputs.run_agent == 'true'
        continue-on-error: true
        id: config-agent
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are maintaining this repository's hardened AI tool configs.

            Read `automation/config-discovery/reports/discovery-summary.json` first.
            Read `automation/config-discovery/reports/latest-config-discovery.md`.
            Follow `automation/config-discovery/agent-prompt.md` only for sources listed under "## Agent review queue".

            Hard limits for this CI run:
            1. Process at most 3 sources from the Agent review queue, starting with the highest-risk admin or security controls.
            2. Ignore sources whose change type is `fingerprint-method-changed` unless they also appear in the Agent review queue.
            3. Do not WebFetch sources that are not in the Agent review queue.
            4. If a source needs no config change, add a short "No config update needed" note to the discovery report and move on.
            5. Keep deployable JSON valid. Use JSONC plus `.comments.md` rationale where comments are needed.
            6. Do not include secrets, tokens, org IDs, tenant IDs, team IDs, or production hostnames.
            7. Do not use em dash characters in prose or comments.
            8. Validate every edited JSON, YAML, TOML, or shell file using the commands in `AGENTS.md`.
            9. Stop as soon as the queued sources are handled or no real control change exists.

            Leave the resulting file changes unstaged. The workflow will commit and open the PR after you finish.
          claude_args: |
            --max-turns 45
            --model claude-sonnet-4-20250514
            --allowedTools "Read,Edit,Write,MultiEdit,Glob,Grep,WebFetch,Bash(git diff *),Bash(git status *),Bash(python3 *),Bash(yamllint *),Bash(bash -n *)"

      - name: Note config agent failure
        if: steps.discovery.outputs.run_agent == 'true' && steps.config-agent.outcome == 'failure'
        run: |
          echo "::warning::Config maintenance agent failed (for example max turns). Committing any partial file changes."

      - name: Commit agent changes
        if: steps.discovery.outputs.run_agent == 'true' && steps.config-agent.outcome != 'skipped'
        id: agent-changes
        env:
          PR_BRANCH: automation/config-maintenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "agent_changed=false" >> "${GITHUB_OUTPUT}"
            echo "Config maintenance agent made no file changes."
            exit 0
          fi

          git add .
          git commit -m "Apply config maintenance updates"
          git push --force-with-lease -u origin "${PR_BRANCH}"
          echo "agent_changed=true" >> "${GITHUB_OUTPUT}"

      - name: Open or update pull request
        if: steps.discovery.outputs.discovery_changed == 'true' || steps.agent-changes.outputs.agent_changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: automation/config-maintenance
          AGENT_CHANGED: ${{ steps.agent-changes.outputs.agent_changed }}
        run: |
          set -euo pipefail

          cat > pr-body.md <<'PR_BODY'
          ## Automated config maintenance update

          The scheduled config discovery workflow detected changes in one or more watched upstream sources, then ran the config-maintenance agent against the generated report.

          Review:

          - `automation/config-discovery/reports/latest-config-discovery.md`
          - `automation/config-discovery/agent-prompt.md`

          Expected reviewer checks:

          1. Confirm any config changes are scoped to real admin or security controls.
          2. Confirm no secrets, tokens, org IDs, tenant IDs, team IDs, or production hostnames were added.
          3. Confirm deployable JSON remains valid and rationale lives in JSONC or `.comments.md` where needed.
          4. Confirm rollout impact, deployment steps, audit logging, rollback, and workflow-preservation notes are updated when behavior changes.

          If this PR contains only discovery snapshot/report changes, the report should include a "No config update needed" explanation for each changed source.
          PR_BODY

          if [ "${AGENT_CHANGED:-false}" = "true" ]; then
            TITLE="Config maintenance: apply upstream config updates"
          else
            TITLE="Config maintenance: upstream changes reviewed"
          fi

          OPEN_PR="$(gh pr list --head "${PR_BRANCH}" --state open --json number --jq '.[0].number // empty')"

          if [ -n "${OPEN_PR}" ]; then
            gh pr edit "${OPEN_PR}" \
              --title "${TITLE}" \
              --body-file pr-body.md
          else
            gh pr create \
              --base "${BASE_BRANCH}" \
              --head "${PR_BRANCH}" \
              --title "${TITLE}" \
              --body-file pr-body.md
          fi
