name: Config Discovery

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: config-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Maintain upstream config coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare discovery branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BRANCH: automation/config-maintenance
        run: |
          set -euo pipefail
          git fetch origin "${BASE_BRANCH}"
          if git ls-remote --exit-code --heads origin "${PR_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${PR_BRANCH}"
            git checkout -B "${PR_BRANCH}" "origin/${PR_BRANCH}"
            git merge --ff-only "origin/${BASE_BRANCH}" || git merge --no-edit "origin/${BASE_BRANCH}"
          else
            git checkout -B "${PR_BRANCH}" "origin/${BASE_BRANCH}"
          fi

      - name: Run config discovery
        id: discovery
        run: |
          set -euo pipefail
          python3 automation/config-discovery/discover_configs.py \
            --sources automation/config-discovery/tool-sources.json \
            --state automation/config-discovery/state/source-snapshots.json \
            --report automation/config-discovery/reports/latest-config-discovery.md

          git add \
            automation/config-discovery/state/source-snapshots.json \
            automation/config-discovery/reports/latest-config-discovery.md

          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No discovery changes to commit."
            exit 0
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Commit discovery signal
        if: steps.discovery.outputs.changed == 'true'
        env:
          PR_BRANCH: automation/config-maintenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update config discovery source snapshots"
          git push -u origin "${PR_BRANCH}"

      - name: Run config maintenance agent
        if: steps.discovery.outputs.changed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are maintaining this repository's hardened AI tool configs.

            Read and follow `automation/config-discovery/agent-prompt.md`.
            Read `automation/config-discovery/reports/latest-config-discovery.md`.

            Goal: turn this discovery branch into a real config-update PR.

            Required behavior:
            1. Review every changed upstream source in the report.
            2. Decide whether each upstream change introduces, removes, renames, or changes the meaning of a real admin, managed-settings, permission, privacy, sandbox, network, MCP, audit, retention, identity, or content-exclusion control.
            3. If a real control changed, update the affected tiered config files, rationale docs, rollout docs, deployment paths, validation steps, and workflow-preservation notes.
            4. If no config update is needed for a changed source, add a concise "No config update needed" note to the discovery report explaining why.
            5. Keep deployable JSON valid. Use JSONC plus `.comments.md` rationale where comments are needed.
            6. Do not include secrets, tokens, org IDs, tenant IDs, team IDs, or production hostnames.
            7. Do not use em dash characters in prose or comments.
            8. Validate every edited JSON, YAML, TOML, or shell file using the commands in `AGENTS.md`.

            Leave the resulting file changes unstaged. The workflow will commit and open the PR after you finish.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Edit,Write,MultiEdit,WebFetch,Bash(git diff *),Bash(git status *),Bash(python3 *),Bash(yamllint *),Bash(bash -n *)"

      - name: Commit agent changes
        if: steps.discovery.outputs.changed == 'true'
        id: agent-changes
        env:
          PR_BRANCH: automation/config-maintenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "agent_changed=false" >> "${GITHUB_OUTPUT}"
            echo "Config maintenance agent made no file changes."
            exit 0
          fi

          git add .
          git commit -m "Apply config maintenance updates"
          git push -u origin "${PR_BRANCH}"
          echo "agent_changed=true" >> "${GITHUB_OUTPUT}"

      - name: Open or update pull request
        if: steps.discovery.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: automation/config-maintenance
          AGENT_CHANGED: ${{ steps.agent-changes.outputs.agent_changed }}
        run: |
          set -euo pipefail

          cat > pr-body.md <<'PR_BODY'
          ## Automated config maintenance update

          The scheduled config discovery workflow detected changes in one or more watched upstream sources, then ran the config-maintenance agent against the generated report.

          Review:

          - `automation/config-discovery/reports/latest-config-discovery.md`
          - `automation/config-discovery/agent-prompt.md`

          Expected reviewer checks:

          1. Confirm any config changes are scoped to real admin or security controls.
          2. Confirm no secrets, tokens, org IDs, tenant IDs, team IDs, or production hostnames were added.
          3. Confirm deployable JSON remains valid and rationale lives in JSONC or `.comments.md` where needed.
          4. Confirm rollout impact, deployment steps, audit logging, rollback, and workflow-preservation notes are updated when behavior changes.

          If this PR contains only discovery snapshot/report changes, the report should include a "No config update needed" explanation for each changed source.
          PR_BODY

          if [ "${AGENT_CHANGED:-false}" = "true" ]; then
            TITLE="Config maintenance: apply upstream config updates"
          else
            TITLE="Config maintenance: upstream changes reviewed"
          fi

          OPEN_PR="$(gh pr list --head "${PR_BRANCH}" --state open --json number --jq '.[0].number // empty')"

          if [ -n "${OPEN_PR}" ]; then
            gh pr edit "${OPEN_PR}" \
              --title "${TITLE}" \
              --body-file pr-body.md
          else
            gh pr create \
              --base "${BASE_BRANCH}" \
              --head "${PR_BRANCH}" \
              --title "${TITLE}" \
              --body-file pr-body.md
          fi
