name: Config Validation

on:
  pull_request:
    paths:
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.toml"
      - "**/*.sh"
      - "automation/config-discovery/*.py"
      - "scripts/validate_config_files.py"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate config syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml toml

      - name: Compile automation scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            automation/config-discovery/discover_configs.py \
            automation/config-discovery/build_agent_scope.py \
            scripts/validate_config_files.py

      - name: Validate deployable config files
        run: |
          set -euo pipefail
          python3 scripts/validate_config_files.py
