name: Config Validation

on:
  pull_request:
  push:
    branches:
      - main
      - "cusor/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate config repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml toml

      - name: Validate automation scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            automation/config-discovery/discover_configs.py \
            automation/config-discovery/build_agent_scope.py \
            scripts/validate_config_files.py

      - name: Validate discovery registry
        run: |
          set -euo pipefail
          python3 automation/config-discovery/discover_configs.py \
            --sources automation/config-discovery/tool-sources.json \
            --state automation/config-discovery/state/source-snapshots.json \
            --report automation/config-discovery/reports/latest-config-discovery.md \
            --check
          python3 automation/config-discovery/discover_configs.py \
            --sources automation/config-discovery/tool-sources.json \
            --state /tmp/source-snapshots.json \
            --report /tmp/latest-config-discovery.md \
            --offline

      - name: Validate deployable configs
        run: |
          set -euo pipefail
          python3 scripts/validate_config_files.py
          git diff --check
