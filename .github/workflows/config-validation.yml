name: Config Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployable configs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml toml

      - name: Fetch base branch
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.repository.default_branch }}"

      - name: Validate config syntax
        run: |
          set -euo pipefail
          python3 scripts/validate_config_files.py --changed --base "origin/${{ github.event.repository.default_branch }}"

      - name: Validate discovery registry
        run: |
          set -euo pipefail
          python3 automation/config-discovery/discover_configs.py \
            --sources automation/config-discovery/tool-sources.json \
            --state automation/config-discovery/state/source-snapshots.json \
            --report automation/config-discovery/reports/latest-config-discovery.md \
            --check
