name: Config Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate config examples
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation libraries
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml toml

      - name: Validate JSON, YAML, TOML, and shell files
        run: |
          set -euo pipefail
          python3 scripts/validate_config_files.py
