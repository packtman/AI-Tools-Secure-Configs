name: Config Validation

on:
  pull_request:
  push:
    branches:
      - main
      - automation/config-maintenance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate config syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml toml

      - name: Validate deployable configs
        run: |
          set -euo pipefail
          python3 scripts/validate_config_files.py
