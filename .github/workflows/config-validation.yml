name: Config Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployable config files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml toml

      - name: Compile automation scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            automation/config-discovery/discover_configs.py \
            automation/config-discovery/build_agent_scope.py \
            scripts/validate_config_files.py

      - name: Validate configs
        run: |
          set -euo pipefail
          python3 scripts/validate_config_files.py
