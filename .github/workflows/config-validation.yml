name: Config Validation

on:
  pull_request:
    paths:
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.toml"
      - "**/*.sh"
      - "automation/config-discovery/**"
      - "scripts/validate_config_files.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate config syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml toml

      - name: Validate deployable config files
        run: |
          set -euo pipefail
          python3 scripts/validate_config_files.py

      - name: Validate discovery registry
        run: |
          set -euo pipefail
          python3 automation/config-discovery/discover_configs.py \
            --sources automation/config-discovery/tool-sources.json \
            --state automation/config-discovery/state/source-snapshots.json \
            --report automation/config-discovery/reports/latest-config-discovery.md \
            --check

      - name: Validate discovery offline mode
        run: |
          set -euo pipefail
          python3 automation/config-discovery/discover_configs.py \
            --sources automation/config-discovery/tool-sources.json \
            --state /tmp/source-snapshots.json \
            --report /tmp/latest-config-discovery.md \
            --offline
