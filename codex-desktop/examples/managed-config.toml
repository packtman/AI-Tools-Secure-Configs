# Codex Desktop App — Managed defaults
# Deploy to: /etc/codex/managed_config.toml (Linux/macOS)
#         or: %USERPROFILE%\.codex\managed_config.toml (Windows)
#         or: via macOS MDM (com.openai.codex:config_toml_base64)
#
# These values override user config.toml and take effect at launch.
# Users can change settings during a session; Codex reapplies on restart.

approval_policy = "on-request"
# WHAT: Default reviewer for escalated approvals (non-app MCP and sandbox escapes).
# WHY: Managed fleets should start with human review; pair with apps._default for connectors.
# BREAKS: auto_review without a guardian policy can approve escalations automatically.
approvals_reviewer = "user"
sandbox_mode    = "workspace-write"
web_search      = "cached"
model           = "o4-mini"

model_reasoning_effort = "high"
cli_auth_credentials_store = "keyring"

[sandbox_workspace_write]
network_access = false

[features]
browser_use = false
computer_use = false
codex_hooks = true
apps = true
enable_mcp_apps = true

# WHAT: Org default for connected apps (connectors) when Apps is enabled.
# WHY: Human reviewer, prompt every tool, deny destructive and open-world hinted tools by default.
# BREAKS: Removing this table lets per-user app settings (or permissive upstream defaults) widen tool risk.
[apps._default]
enabled = true
approvals_reviewer = "user"
default_tools_approval_mode = "prompt"
destructive_enabled = false
open_world_enabled = false

# OpenTelemetry — point at your corporate OTLP collector
[otel]
environment = "prod"
exporter = "otlp-http"
log_user_prompt = false
