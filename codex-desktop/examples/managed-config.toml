# Codex Desktop App — Managed defaults
# Deploy to: /etc/codex/managed_config.toml (Linux/macOS)
#         or: %USERPROFILE%\.codex\managed_config.toml (Windows)
#         or: via macOS MDM (com.openai.codex:config_toml_base64)
#
# These values override user config.toml and take effect at launch.
# Users can change settings during a session; Codex reapplies on restart.

approval_policy = "on-request"
sandbox_mode    = "workspace-write"
web_search      = "cached"
model           = "o4-mini"

model_reasoning_effort = "high"
cli_auth_credentials_store = "keyring"

[sandbox_workspace_write]
network_access = false

[features]
browser_use = false
computer_use = false
codex_hooks = true

# Default only. requirements.toml is the lock users cannot override.
# WHAT: stops Browser Use from reading local browser history when this file is reapplied at launch.
# WHY: a host that has not received requirements.toml yet still starts with history off.
# WHAT BREAKS: history-based resume fails until restart if a user flips this during a session. The requirements pin closes that gap.
[browser_use]
allow_history_access = false

# OpenTelemetry — point at your corporate OTLP collector
[otel]
environment = "prod"
exporter = "otlp-http"
log_user_prompt = false
