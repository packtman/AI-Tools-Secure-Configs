# Codex Desktop App — BASELINE admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# For startups and individual developers — essential guardrails only.

# Block the most dangerous sandbox mode
allowed_approval_policies = ["untrusted", "on-request", "never"]
allowed_sandbox_modes = ["read-only", "workspace-write"]
allowed_web_search_modes = ["cached", "live"]

# WHAT: Allow shell tools to run as login shells (source ~/.zprofile, ~/.bash_profile).
# WHY: Baseline: login shells still re-import credentials that environment policy stripped.
# WHAT BREAKS: Commands that rely on profile-exported PATH extras fail. Put those vars in [shell_environment_policy] set instead.
allow_login_shell = false

# WHAT: Device remote control for managed Codex sessions.
# WHY: Baseline: remote control is still an unattended endpoint access path, even for startups.
# WHAT BREAKS: Remote-control pairing fails. Developers stay on local sessions.
allow_remote_control = false

# Pin the highest-risk 0.149.0+ surfaces. Fast mode and Goals stay unconstrained.
[features]
computer_use = false
# WHAT: Skills may prompt to install missing MCP (Model Context Protocol) dependencies.
# WHY: Baseline: auto-install is still a supply-chain path even for startups.
# WHAT BREAKS: Skills that need extra MCP packages fail until the user installs a reviewed package.
skill_mcp_dependency_install = false

# Block privilege escalation
[rules]
prefix_rules = [
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "prompt", justification = "Privilege escalation requires explicit approval." },
]
