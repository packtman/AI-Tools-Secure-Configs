# Codex Desktop App - BASELINE admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# Requires Codex 0.138.0 or later for managed permission-profile enforcement.
# For startups and individual developers: essential guardrails only.

# WHAT: Allows cautious, interactive, and unattended approval styles.
# WHY: Baseline keeps automation workflows while permission profiles limit filesystem reach.
# BREAKS: Removing this leaves approval unconstrained; pairing "never" with full-system access is unsafe.
allowed_approval_policies = ["untrusted", "on-request", "never"]

# WHAT: Permits cached and live search (disabled remains implicitly allowed).
# WHY: Baseline prioritizes research speed and relies on workspace containment for the minimum guardrail.
# BREAKS: Live search can expose query content externally; narrowing this list can disrupt research.
allowed_web_search_modes = ["cached", "live"]

# WHAT: Selects workspace-scoped read and write access at startup.
# WHY: Baseline users need normal code editing without default full-system access.
# BREAKS: Omitting this makes startup behavior less predictable; a denied profile cannot become the default.
default_permissions = ":workspace"

# WHAT: Disables device remote control for managed users.
# WHY: Remote control expands the remote attack surface beyond local coding workflows.
# BREAKS: Teams that rely on device remote control lose that workflow and need an exception path.
allow_remote_control = false

# WHAT: Allows only read-only and workspace profiles; omitted profiles are denied.
# WHY: Still blocks ":danger-full-access" and future built-ins until reviewed.
# BREAKS: Removing this table allows users to select full-system access.
[allowed_permission_profiles]
":read-only" = true
":workspace" = true

# WHAT: Pins the most dangerous desktop feature off.
# WHY: Computer Use grants screen and input control; Baseline still blocks that by default.
# BREAKS: Removing this pin lets users enable desktop control without admin review.
[features]
computer_use = false

# WHAT: Prompts before privilege-escalation commands.
# WHY: Essential guardrail for accidental or injected sudo/su/doas use.
# BREAKS: Removing the rule allows silent privilege escalation attempts.
[rules]
prefix_rules = [
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "prompt", justification = "Privilege escalation requires explicit approval." },
]
