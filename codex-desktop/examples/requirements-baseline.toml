# Codex Desktop App — BASELINE admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# For startups and individual developers — essential guardrails only.

# Block the most dangerous sandbox mode
allowed_approval_policies = ["untrusted", "on-request", "never"]
allowed_sandbox_modes = ["read-only", "workspace-write"]
allowed_web_search_modes = ["cached", "live"]

# Only pin the most dangerous features.
# browser_use stays unset so a startup can still use Codex's own browser.
[features]
computer_use = false

# WHAT: Blocks Codex from driving an external browser through the ChatGPT
# browser extension, including tabs that are already open and signed in.
# WHY (Baseline): Vendor default is enabled (stable since 2026-04-30, commit
# 719431d). Omitting the key leaves that path allowed. Signed-in tabs carry
# the user's cookies. This is a requirements pin only.
# WHAT BREAKS: The extension can no longer drive Chrome or another external
# browser. Codex's own Browser Use still follows the browser_use setting.
# Removing this key turns the extension path back on.
browser_use_external = false

# Block privilege escalation
[rules]
prefix_rules = [
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "prompt", justification = "Privilege escalation requires explicit approval." },
]
