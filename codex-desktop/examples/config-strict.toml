# Codex Desktop App — STRICT configuration
# For regulated environments (finance, healthcare, government) where AI tool
# access must be minimized and every action requires explicit human approval.
# Deploy to: ~/.codex/config.toml or via managed_config.toml

sandbox_mode = "read-only"
approval_policy = "on-request"
cli_auth_credentials_store = "keyring"
model = "o4-mini"
model_reasoning_effort = "high"
web_search = "disabled"

# WHAT: Allow shell tools to run as login shells (source ~/.zprofile, ~/.bash_profile).
# WHY: Strict: login shells re-import credentials that shell_environment_policy already stripped.
# WHAT BREAKS: Commands that rely on profile-exported PATH extras fail. Put those vars in [shell_environment_policy] set instead.
allow_login_shell = false

[sandbox_workspace_write]
network_access = false

[features]
browser_use = false
in_app_browser = false
computer_use = false
memories = false
codex_hooks = true
multi_agent = false
undo = false
shell_snapshot = false
# WHAT: Fast-tier model selection (service_tier = "fast") in the TUI and Desktop.
# WHY: Strict: Fast mode is a premium processing path. Keep it off until FinOps and security approve it.
# WHAT BREAKS: /fast and Fast-tier model picks fail. Developers use the standard catalog instead.
fast_mode = false
# WHAT: Persisted goals with automatic continuation across turns.
# WHY: Strict: goals retain task context on disk and can continue work without a new human prompt.
# WHAT BREAKS: Goal save/resume and auto-continue stop.
goals = false
# WHAT: Skills may prompt to install missing MCP (Model Context Protocol) dependencies.
# WHY: Strict: auto-install is a supply-chain path. Packages run with the user's identity.
# WHAT BREAKS: Skills that need extra MCP packages fail until IT installs the reviewed package.
skill_mcp_dependency_install = false

[shell_environment_policy]
include_only = ["PATH", "HOME"]
