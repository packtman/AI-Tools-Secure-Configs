# Codex Desktop App — STRICT admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# For regulated environments (finance, healthcare, government).

allowed_approval_policies = ["untrusted", "on-request"]
allowed_sandbox_modes = ["read-only"]
allowed_web_search_modes = []
enforce_residency = "us"

# WHAT: Disable Appshots (ChatGPT desktop on macOS captures the frontmost window image plus available text and sends it to ChatGPT).
# WHY: Strict: omit leaves Appshots unconstrained. A hotkey can share email, credentials, or regulated data from any Mac window. Distinct from Computer Use (agent clicks) and Browser Use.
# BREAKS IF omitted or true: Screen Recording and Accessibility capture stay available. CLI cannot create Appshots; it can still see an Appshot already in chat history.
allow_appshots = false

# WHAT: Disable device remote control for managed Codex clients (ChatGPT desktop, Codex CLI, IDE extension).
# WHY: Strict: omit leaves remote control unconstrained. Distinct from Claude Code disableRemoteControl and Copilot remoteControl.mode. Does not disable SSH.
# BREAKS IF omitted or true: a remote client can control this device's Codex session. SSH remote connections keep working.
allow_remote_control = false

# Disable all extended features
[features]
browser_use = false
in_app_browser = false
computer_use = false
memories = false
multi_agent = false

# Deny reads to sensitive directories
[permissions.filesystem]
deny_read = [
  "/etc/shadow",
  "/etc/passwd",
  "~/.ssh",
  "~/.aws",
  "~/.config/gcloud",
  ".env",
  "**/*.pem",
  "**/*.key",
]

# Block dangerous commands
[rules]
prefix_rules = [
  { pattern = [{ any_of = ["rm", "rmdir"] }], decision = "forbidden", justification = "Destructive file operations are not permitted." },
  { pattern = [{ token = "git" }, { any_of = ["push", "commit", "rebase", "reset"] }], decision = "forbidden", justification = "Git mutations are not permitted in read-only mode." },
  { pattern = [{ any_of = ["curl", "wget", "nc", "ncat"] }], decision = "forbidden", justification = "Network operations are forbidden in strict mode." },
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "forbidden", justification = "Privilege escalation is not permitted." },
]

# No MCP servers allowed
# (empty mcp_servers table disables all MCP)
[mcp_servers]
