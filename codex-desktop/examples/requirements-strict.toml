# Codex Desktop App — STRICT admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# For regulated environments (finance, healthcare, government).

allowed_approval_policies = ["untrusted", "on-request"]
allowed_sandbox_modes = ["read-only"]
allowed_web_search_modes = []
enforce_residency = "us"

# Disable all extended features
[features]
browser_use = false
in_app_browser = false
computer_use = false
memories = false
multi_agent = false
# WHAT: hides ChatGPT and ChatGPT Work conversation screens and the related cloud automation UI in the ChatGPT desktop app.
# WHY (Strict): those screens can send source code, secrets, or customer data off the laptop. Omitting this key leaves the screens unconstrained even when other features are off. Setting it to true does not hide them and does not bypass account, workspace-permission, or rollout checks. Users cannot override a requirements value. Keep this key in the [features] table of requirements.toml. ChatGPT Voice stays available. Existing cloud tasks keep running. This key is separate from features.in_app_dictation and features.realtime_conversation.
# WHAT BREAKS: ChatGPT and ChatGPT Work conversation screens, and the related cloud automation UI, disappear from the desktop app. Use the local Codex coding session instead. Do not set true. TOML boolean false only.
in_app_chat = false

# Deny reads to sensitive directories
[permissions.filesystem]
deny_read = [
  "/etc/shadow",
  "/etc/passwd",
  "~/.ssh",
  "~/.aws",
  "~/.config/gcloud",
  ".env",
  "**/*.pem",
  "**/*.key",
]

# Block dangerous commands
[rules]
prefix_rules = [
  { pattern = [{ any_of = ["rm", "rmdir"] }], decision = "forbidden", justification = "Destructive file operations are not permitted." },
  { pattern = [{ token = "git" }, { any_of = ["push", "commit", "rebase", "reset"] }], decision = "forbidden", justification = "Git mutations are not permitted in read-only mode." },
  { pattern = [{ any_of = ["curl", "wget", "nc", "ncat"] }], decision = "forbidden", justification = "Network operations are forbidden in strict mode." },
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "forbidden", justification = "Privilege escalation is not permitted." },
]

# No MCP servers allowed
# (empty mcp_servers table disables all MCP)
[mcp_servers]
