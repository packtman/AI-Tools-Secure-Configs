# Codex Desktop App — STRICT admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# For regulated environments (finance, healthcare, government).

allowed_approval_policies = ["untrusted", "on-request"]
allowed_sandbox_modes = ["read-only"]
allowed_web_search_modes = []
enforce_residency = "us"

# Disable all extended features
[features]
browser_use = false
in_app_browser = false
computer_use = false
memories = false
multi_agent = false

# WHAT: stops Browser Use from saving or honoring an "Always allow" approval on origins that use the fallback (sites with no matching browser_use.origins entry).
# WHY (Strict): features.browser_use = false turns Browser Use off. Omitting this key does not block Always allow on those sites, so a later exception that allows Browser Use can still save a lasting approval. Approvals for the current turn or thread can still apply. Users cannot override a requirements value. Nested table [browser_use.default_origin_policy], not a [features] key and not a sibling of allow_global_persistent_approval. This key belongs in requirements.toml, not config.toml.
# WHAT BREAKS: a saved Always allow on an unmatched site is not honored until this key is removed. Approve the current turn or thread for that site. Do not set true. true makes Always allow available when otherwise permitted but does not create an approval. TOML boolean false only.
[browser_use.default_origin_policy]
persistent_approval = false

# Deny reads to sensitive directories
[permissions.filesystem]
deny_read = [
  "/etc/shadow",
  "/etc/passwd",
  "~/.ssh",
  "~/.aws",
  "~/.config/gcloud",
  ".env",
  "**/*.pem",
  "**/*.key",
]

# Block dangerous commands
[rules]
prefix_rules = [
  { pattern = [{ any_of = ["rm", "rmdir"] }], decision = "forbidden", justification = "Destructive file operations are not permitted." },
  { pattern = [{ token = "git" }, { any_of = ["push", "commit", "rebase", "reset"] }], decision = "forbidden", justification = "Git mutations are not permitted in read-only mode." },
  { pattern = [{ any_of = ["curl", "wget", "nc", "ncat"] }], decision = "forbidden", justification = "Network operations are forbidden in strict mode." },
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "forbidden", justification = "Privilege escalation is not permitted." },
]

# No MCP servers allowed
# (empty mcp_servers table disables all MCP)
[mcp_servers]
