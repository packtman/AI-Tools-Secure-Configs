# Codex Desktop App — STRICT admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# For regulated environments (finance, healthcare, government).

allowed_approval_policies = ["untrusted", "on-request"]
allowed_sandbox_modes = ["read-only"]
allowed_web_search_modes = []
enforce_residency = "us"

# WHAT: Allow shell tools to run as login shells (source ~/.zprofile, ~/.bash_profile).
# WHY: Strict: login shells re-import credentials that shell_environment_policy already stripped.
# WHAT BREAKS: Commands that rely on profile-exported PATH extras fail. Put those vars in [shell_environment_policy] set instead.
allow_login_shell = false

# WHAT: Appshots captures screenshots of other desktop apps for the agent.
# WHY: Strict: screenshots can include secrets, customer data, or other users' windows.
# WHAT BREAKS: Appshots and screenshot-driven Computer Use workflows fail. Developers describe the UI in text instead.
allow_appshots = false
# WHAT: Device remote control for managed Codex sessions.
# WHY: Strict: remote control is an unattended endpoint access path.
# WHAT BREAKS: Remote-control pairing and remote Desktop sessions fail. Developers stay on local sessions.
allow_remote_control = false

# Disable all extended features. Requires Codex 0.149.0 or later for fast_mode/goals/skill MCP pins.
[features]
browser_use = false
in_app_browser = false
computer_use = false
memories = false
multi_agent = false
# WHAT: Fast-tier model selection (service_tier = "fast").
# WHY: Strict: Fast mode is a premium processing path. Pin it off so users cannot opt in locally.
# WHAT BREAKS: /fast and Fast-tier model picks fail closed.
fast_mode = false
# WHAT: Persisted goals with automatic continuation across turns.
# WHY: Strict: goals retain task context and can continue work without a new human prompt.
# WHAT BREAKS: Goal save/resume and auto-continue stop.
goals = false
# WHAT: Skills may prompt to install missing MCP (Model Context Protocol) dependencies.
# WHY: Strict: auto-install is a supply-chain path. Packages run with the user's identity.
# WHAT BREAKS: Skills that need extra MCP packages fail until IT installs the reviewed package.
skill_mcp_dependency_install = false

# Deny reads to sensitive directories
[permissions.filesystem]
deny_read = [
  "/etc/shadow",
  "/etc/passwd",
  "~/.ssh",
  "~/.aws",
  "~/.config/gcloud",
  ".env",
  "**/*.pem",
  "**/*.key",
]

# Block dangerous commands
[rules]
prefix_rules = [
  { pattern = [{ any_of = ["rm", "rmdir"] }], decision = "forbidden", justification = "Destructive file operations are not permitted." },
  { pattern = [{ token = "git" }, { any_of = ["push", "commit", "rebase", "reset"] }], decision = "forbidden", justification = "Git mutations are not permitted in read-only mode." },
  { pattern = [{ any_of = ["curl", "wget", "nc", "ncat"] }], decision = "forbidden", justification = "Network operations are forbidden in strict mode." },
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "forbidden", justification = "Privilege escalation is not permitted." },
]

# No MCP servers allowed
# (empty mcp_servers table disables all MCP)
[mcp_servers]
