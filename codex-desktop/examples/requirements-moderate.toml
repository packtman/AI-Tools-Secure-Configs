# Codex Desktop App — MODERATE admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# For standard enterprise development teams.

allowed_approval_policies = ["untrusted", "on-request"]
allowed_sandbox_modes = ["read-only", "workspace-write"]
allowed_web_search_modes = ["cached"]

# WHAT: Disable Appshots (ChatGPT desktop on macOS captures the frontmost window image plus available text and sends it to ChatGPT).
# WHY: Moderate: omit leaves Appshots unconstrained. A hotkey can share email, credentials, or regulated data from any Mac window. Distinct from Computer Use (agent clicks) and Browser Use.
# BREAKS IF omitted or true: Screen Recording and Accessibility capture stay available. CLI cannot create Appshots; it can still see an Appshot already in chat history.
allow_appshots = false

# WHAT: Disable device remote control for managed Codex clients (ChatGPT desktop, Codex CLI, IDE extension).
# WHY: Moderate: omit leaves remote control unconstrained. Distinct from Claude Code disableRemoteControl and Copilot remoteControl.mode. Does not disable SSH.
# BREAKS IF omitted or true: a remote client can control this device's Codex session. SSH remote connections keep working.
allow_remote_control = false

# Disable high-risk features but allow core development
[features]
browser_use = false
computer_use = false
codex_hooks = true

# Deny reads to credential files
[permissions.filesystem]
deny_read = [
  "~/.ssh/id_*",
  "~/.aws/credentials",
  "**/*.pem",
  "**/*.key",
]

# Require approval for risky commands
[rules]
prefix_rules = [
  { pattern = [{ token = "git" }, { any_of = ["push", "force-push"] }], decision = "prompt", justification = "Require review before pushing to remote." },
  { pattern = [{ token = "rm" }, { token = "-rf" }], decision = "prompt", justification = "Recursive delete requires explicit approval." },
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "forbidden", justification = "Privilege escalation is not permitted." },
]

# Only approved MCP servers
[mcp_servers.filesystem]
identity = { command = "npx" }

[mcp_servers.git]
identity = { command = "uvx" }
