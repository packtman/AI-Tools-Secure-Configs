# Codex Desktop App — MODERATE admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# For standard enterprise development teams.

allowed_approval_policies = ["untrusted", "on-request"]
allowed_sandbox_modes = ["read-only", "workspace-write"]
allowed_web_search_modes = ["cached"]

# Disable high-risk features but allow core development
[features]
browser_use = false
computer_use = false
codex_hooks = true

# Built-in browser pane only. This is not features.in_app_browser and not Browser Use.
[in_app_browser]
# WHAT: blocks importing settings or browsing data from an external browser into the built-in browser pane.
# WHY (Moderate): an import can copy cookies, saved site data, and history from Chrome, Edge, or another browser into Codex. Omitting this key leaves import available when other product checks allow it. Setting it to true does not block import. features.in_app_browser = false turns the pane off and is not a substitute, because a later exception that turns the pane on would still allow import. Users cannot override a requirements value. This key belongs in requirements.toml, not in config.toml, and not under [features].
# WHAT BREAKS: the import action in the built-in browser stops. Sign in to the specific site inside the pane, or paste the URL. Do not set true. TOML boolean false only.
allow_external_browser_settings_import = false

# Deny reads to credential files
[permissions.filesystem]
deny_read = [
  "~/.ssh/id_*",
  "~/.aws/credentials",
  "**/*.pem",
  "**/*.key",
]

# Require approval for risky commands
[rules]
prefix_rules = [
  { pattern = [{ token = "git" }, { any_of = ["push", "force-push"] }], decision = "prompt", justification = "Require review before pushing to remote." },
  { pattern = [{ token = "rm" }, { token = "-rf" }], decision = "prompt", justification = "Recursive delete requires explicit approval." },
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "forbidden", justification = "Privilege escalation is not permitted." },
]

# Only approved MCP servers
[mcp_servers.filesystem]
identity = { command = "npx" }

[mcp_servers.git]
identity = { command = "uvx" }
