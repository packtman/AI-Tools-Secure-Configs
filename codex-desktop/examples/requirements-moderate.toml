# Codex Desktop App — MODERATE admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# For standard enterprise development teams.

allowed_approval_policies = ["untrusted", "on-request"]
allowed_sandbox_modes = ["read-only", "workspace-write"]
allowed_web_search_modes = ["cached"]

# Disable high-risk features but allow core development
[features]
browser_use = false
computer_use = false
codex_hooks = true
# WHAT: hides ChatGPT and ChatGPT Work conversation screens and the related cloud automation UI in the ChatGPT desktop app.
# WHY (Moderate): those screens can send source code, secrets, or customer data off the laptop. Omitting this key leaves the screens unconstrained by requirements. Setting it to true does not hide them and does not bypass account, workspace-permission, or rollout checks. Users cannot override a requirements value. Keep this key in the [features] table of requirements.toml. ChatGPT Voice stays available. Existing cloud tasks keep running. This key is separate from features.in_app_dictation and features.realtime_conversation.
# WHAT BREAKS: ChatGPT and ChatGPT Work conversation screens, and the related cloud automation UI, disappear from the desktop app. Use the local Codex coding session instead. Do not set true. TOML boolean false only.
in_app_chat = false

# Deny reads to credential files
[permissions.filesystem]
deny_read = [
  "~/.ssh/id_*",
  "~/.aws/credentials",
  "**/*.pem",
  "**/*.key",
]

# Require approval for risky commands
[rules]
prefix_rules = [
  { pattern = [{ token = "git" }, { any_of = ["push", "force-push"] }], decision = "prompt", justification = "Require review before pushing to remote." },
  { pattern = [{ token = "rm" }, { token = "-rf" }], decision = "prompt", justification = "Recursive delete requires explicit approval." },
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "forbidden", justification = "Privilege escalation is not permitted." },
]

# Only approved MCP servers
[mcp_servers.filesystem]
identity = { command = "npx" }

[mcp_servers.git]
identity = { command = "uvx" }
