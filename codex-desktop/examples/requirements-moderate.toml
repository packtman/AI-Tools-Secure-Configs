# Codex Desktop App — MODERATE admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# For standard enterprise development teams.

allowed_approval_policies = ["untrusted", "on-request"]
allowed_sandbox_modes = ["read-only", "workspace-write"]
allowed_web_search_modes = ["cached"]

# WHAT: Allow shell tools to run as login shells (source ~/.zprofile, ~/.bash_profile).
# WHY: Moderate: login shells re-import credentials that shell_environment_policy already stripped.
# WHAT BREAKS: Commands that rely on profile-exported PATH extras fail. Put those vars in [shell_environment_policy] set instead.
allow_login_shell = false

# WHAT: Appshots captures screenshots of other desktop apps for the agent.
# WHY: Moderate: screenshots can include secrets from browsers, password managers, or chat apps.
# WHAT BREAKS: Appshots workflows fail. Developers describe the UI in text or share redacted screenshots manually.
allow_appshots = false
# WHAT: Device remote control for managed Codex sessions.
# WHY: Moderate: remote control is an unattended endpoint access path.
# WHAT BREAKS: Remote-control pairing fails. Developers stay on local sessions.
allow_remote_control = false

# Disable high-risk features but allow core development.
# Requires Codex 0.149.0 or later for fast_mode/goals/skill MCP pins.
[features]
browser_use = false
computer_use = false
codex_hooks = true
# WHAT: Fast-tier model selection (service_tier = "fast").
# WHY: Moderate: Fast mode changes spend and processing path without a review gate.
# WHAT BREAKS: /fast and Fast-tier model picks fail closed.
fast_mode = false
# WHAT: Persisted goals with automatic continuation across turns.
# WHY: Moderate: unattended continuation plus on-disk goal state is extra retention and extra shell.
# WHAT BREAKS: Goal save/resume and auto-continue stop.
goals = false
# WHAT: Skills may prompt to install missing MCP (Model Context Protocol) dependencies.
# WHY: Moderate: auto-install is a supply-chain path. Packages run with the user's identity.
# WHAT BREAKS: Skills that need extra MCP packages fail until IT installs the reviewed package.
skill_mcp_dependency_install = false

# Deny reads to credential files
[permissions.filesystem]
deny_read = [
  "~/.ssh/id_*",
  "~/.aws/credentials",
  "**/*.pem",
  "**/*.key",
]

# Require approval for risky commands
[rules]
prefix_rules = [
  { pattern = [{ token = "git" }, { any_of = ["push", "force-push"] }], decision = "prompt", justification = "Require review before pushing to remote." },
  { pattern = [{ token = "rm" }, { token = "-rf" }], decision = "prompt", justification = "Recursive delete requires explicit approval." },
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "forbidden", justification = "Privilege escalation is not permitted." },
]

# Only approved MCP servers
[mcp_servers.filesystem]
identity = { command = "npx" }

[mcp_servers.git]
identity = { command = "uvx" }
