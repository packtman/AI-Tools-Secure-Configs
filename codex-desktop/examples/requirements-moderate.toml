# Codex Desktop App — MODERATE admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# For standard enterprise development teams.

allowed_approval_policies = ["untrusted", "on-request"]
allowed_sandbox_modes = ["read-only", "workspace-write"]
allowed_web_search_modes = ["cached"]
allow_appshots = false
allow_remote_control = false

# Disable high-risk features but allow core development
[features]
browser_use = false
computer_use = false
codex_hooks = true
in_app_local_automation = false
in_app_dictation = false
realtime_conversation = false
in_app_chat = false

[browser_use]
allow_history_access = false
allow_global_persistent_approval = false
disable_auto_review = true

[computer_use]
allow_persistent_approval = false

[in_app_browser]
allow_external_browser_settings_import = false

[browser_use.default_origin_policy]
persistent_approval = false
uploads = "deny"
# WHAT: Blocks full Chrome DevTools Protocol (CDP) access on sites that have no matching browser_use.origins rule. CDP is the browser debugging interface that can read cookies, storage, and network traffic, and can run script in the page.
# WHY (Moderate): An unlisted site can be prompt-injected. Full CDP then exposes the signed-in browser beyond normal Browser Use actions. "deny" is the lock. "allow" only continues normal opt-in and approval checks.
# BREAKS: Removing this, or setting "allow", leaves fallback-origin CDP unrestricted by this key. It does not block uploads, downloads, page access, or Always allow. Do not also set access = "deny": that blocks Browser Use on every fallback origin. This is not features.browser_use_full_cdp_access.
full_cdp_access = "deny"

# Deny reads to credential files
[permissions.filesystem]
deny_read = [
  "~/.ssh/id_*",
  "~/.aws/credentials",
  "**/*.pem",
  "**/*.key",
]

# Require approval for risky commands
[rules]
prefix_rules = [
  { pattern = [{ token = "git" }, { any_of = ["push", "force-push"] }], decision = "prompt", justification = "Require review before pushing to remote." },
  { pattern = [{ token = "rm" }, { token = "-rf" }], decision = "prompt", justification = "Recursive delete requires explicit approval." },
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "forbidden", justification = "Privilege escalation is not permitted." },
]

# Only approved MCP servers
[mcp_servers.filesystem]
identity = { command = "npx" }

[mcp_servers.git]
identity = { command = "uvx" }
