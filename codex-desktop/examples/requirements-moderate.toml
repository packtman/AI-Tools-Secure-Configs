# Codex Desktop App — MODERATE admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM, or system file (/etc/codex/requirements.toml).
# For standard enterprise development teams.

allowed_approval_policies = ["untrusted", "on-request"]
allowed_sandbox_modes = ["read-only", "workspace-write"]
allowed_web_search_modes = ["cached"]

# Disable high-risk features but allow core development
[features]
browser_use = false
computer_use = false
codex_hooks = true

# WHAT: stops Browser Use from saving or honoring an "Always allow" approval on origins that use the fallback (sites with no matching browser_use.origins entry).
# WHY (Moderate): features.browser_use = false turns Browser Use off. Omitting this key does not block Always allow on those sites, so a later exception that allows Browser Use can still save a lasting approval. Approvals for the current turn or thread can still apply. Users cannot override a requirements value. Nested table [browser_use.default_origin_policy], not a [features] key and not a sibling of allow_global_persistent_approval. This key belongs in requirements.toml, not config.toml.
# WHAT BREAKS: a saved Always allow on an unmatched site is not honored until this key is removed. Approve the current turn or thread for that site. Do not set true. true makes Always allow available when otherwise permitted but does not create an approval. TOML boolean false only.
[browser_use.default_origin_policy]
persistent_approval = false

# Deny reads to credential files
[permissions.filesystem]
deny_read = [
  "~/.ssh/id_*",
  "~/.aws/credentials",
  "**/*.pem",
  "**/*.key",
]

# Require approval for risky commands
[rules]
prefix_rules = [
  { pattern = [{ token = "git" }, { any_of = ["push", "force-push"] }], decision = "prompt", justification = "Require review before pushing to remote." },
  { pattern = [{ token = "rm" }, { token = "-rf" }], decision = "prompt", justification = "Recursive delete requires explicit approval." },
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "forbidden", justification = "Privilege escalation is not permitted." },
]

# Only approved MCP servers
[mcp_servers.filesystem]
identity = { command = "npx" }

[mcp_servers.git]
identity = { command = "uvx" }
