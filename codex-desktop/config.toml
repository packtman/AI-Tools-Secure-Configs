# Codex Desktop App — Secure configuration template
# Deploy to: ~/.codex/config.toml
# Shared across Codex App, CLI, and IDE extension.

# Sandbox mode — "workspace-write" limits writes to the active workspace
# and disables network access by default. Never use "danger-full-access"
# in production or shared environments.
sandbox_mode = "workspace-write"

# Approval policy — "on-request" requires human confirmation before
# every write/execute operation while allowing automatic reads.
approval_policy = "on-request"

# Credential storage — "keyring" uses OS credential store (macOS Keychain,
# Windows Credential Manager, Linux Secret Service). Avoids plaintext files.
cli_auth_credentials_store = "keyring"

# Model — pin to a specific model to prevent drift across the team.
model = "o4-mini"

# Web search — "cached" returns pre-indexed results, reducing exposure
# to prompt injection from live web content.
web_search = "cached"

# WHAT: Allow shell tools to run as login shells (source ~/.zprofile, ~/.bash_profile).
# WHY: Login shells re-import credentials that shell_environment_policy already stripped.
# WHAT BREAKS: Commands that rely on profile-exported PATH extras fail. Put those vars in [shell_environment_policy] set instead.
allow_login_shell = false

# Reasoning effort — set explicit reasoning level.
model_reasoning_effort = "high"

# Sandbox network settings
[sandbox_workspace_write]
network_access = false

# Feature flags: disable high-risk features by default.
# Codex 0.149.0+ also exposes Fast mode, Goals, and skill MCP installs.
[features]
browser_use = false
in_app_browser = false
computer_use = false
memories = false
codex_hooks = true
multi_agent = true
# WHAT: Fast-tier model selection (service_tier = "fast").
# WHY: Enterprise default: Fast mode is a premium processing path. Keep it off until FinOps approves it.
# WHAT BREAKS: /fast and Fast-tier model picks fail.
fast_mode = false
# WHAT: Persisted goals with automatic continuation across turns.
# WHY: Enterprise default: goals retain task context and can continue work without a new prompt.
# WHAT BREAKS: Goal save/resume and auto-continue stop.
goals = false
# WHAT: Skills may prompt to install missing MCP (Model Context Protocol) dependencies.
# WHY: Auto-install is a supply-chain path. Packages run with the user's identity.
# WHAT BREAKS: Skills that need extra MCP packages fail until IT installs the reviewed package.
skill_mcp_dependency_install = false

# Shell environment — only forward essential variables to spawned commands.
[shell_environment_policy]
include_only = ["PATH", "HOME", "USER", "SHELL", "LANG", "TERM"]
