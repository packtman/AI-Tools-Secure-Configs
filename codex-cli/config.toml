# Codex CLI — Secure user-level configuration
# Deploy to: ~/.codex/config.toml

# Sandbox mode controls what the agent can technically do.
# "workspace-write" limits writes to the active workspace and disables network.
sandbox_mode = "workspace-write"

# Approval policy controls when the agent pauses for human confirmation.
# "on-request" = ask before every command execution.
approval_policy = "on-request"

# Credential storage — "keyring" uses the OS credential store (most secure).
cli_auth_credentials_store = "keyring"

# Model selection — pin to a specific model to prevent drift.
model = "o4-mini"

# WHAT: Allow shell tools to run as login shells (source ~/.zprofile, ~/.bash_profile).
# WHY: Login shells re-import credentials that shell_environment_policy already stripped.
# WHAT BREAKS: Commands that rely on profile-exported PATH extras fail. Put those vars in [shell_environment_policy] set instead.
allow_login_shell = false

# Sandbox network settings: disabled by default for security.
[sandbox_workspace_write]
network_access = false

# Codex 0.149.0+ pins. config.toml is a default, not an enforcement lock.
# Copy the same keys into /etc/codex/requirements.toml for managed fleets.
[features]
# WHAT: Fast-tier model selection (service_tier = "fast") in the TUI.
# WHY: Enterprise default: Fast mode is a premium processing path. Keep it off until FinOps approves it.
# WHAT BREAKS: /fast and Fast-tier model picks fail. Developers use the standard catalog instead.
fast_mode = false
# WHAT: Persisted goals with automatic continuation across turns.
# WHY: Enterprise default: goals retain task context and can continue work without a new prompt.
# WHAT BREAKS: Goal save/resume and auto-continue stop.
goals = false
# WHAT: Skills may prompt to install missing MCP (Model Context Protocol) dependencies.
# WHY: Auto-install is a supply-chain path. Packages run with the user's identity.
# WHAT BREAKS: Skills that need extra MCP packages fail until IT installs the reviewed package.
skill_mcp_dependency_install = false
