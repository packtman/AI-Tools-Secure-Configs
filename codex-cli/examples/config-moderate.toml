# Codex CLI — MODERATE configuration
# Balanced for development teams — write access allowed, network off, approval required.

sandbox_mode = "workspace-write"
approval_policy = "on-request"
cli_auth_credentials_store = "keyring"
model = "o4-mini"

# WHAT: Allow shell tools to run as login shells (source ~/.zprofile, ~/.bash_profile).
# WHY: Moderate: login shells re-import credentials that shell_environment_policy already stripped.
# WHAT BREAKS: Commands that rely on profile-exported PATH extras fail. Put those vars in [shell_environment_policy] set instead.
allow_login_shell = false

[sandbox_workspace_write]
network_access = false

# Codex 0.149.0+ feature pins. Users can still override config.toml; deploy the
# matching keys in /etc/codex/requirements.toml (see ../codex-desktop/examples/).
[features]
# WHAT: Fast-tier model selection (service_tier = "fast") in the TUI.
# WHY: Moderate: Fast mode changes spend and processing path without a security review gate.
# WHAT BREAKS: /fast and Fast-tier model picks fail. Developers use the standard catalog instead.
fast_mode = false
# WHAT: Persisted goals with automatic continuation across turns.
# WHY: Moderate: unattended continuation plus on-disk goal state is extra retention and extra shell.
# WHAT BREAKS: Goal save/resume and auto-continue stop. Keep using one-shot threads with approval_policy.
goals = false
# WHAT: Skills may prompt to install missing MCP (Model Context Protocol) dependencies.
# WHY: Moderate: auto-install is a supply-chain path. Packages run with the user's identity.
# WHAT BREAKS: Skills that need extra MCP packages fail until IT installs the reviewed package.
skill_mcp_dependency_install = false
