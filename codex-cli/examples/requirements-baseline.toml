# Codex CLI  -  BASELINE admin-enforced requirements
# Users CANNOT override these constraints. Deploy via cloud-managed config,
# macOS MDM (com.openai.codex:requirements_toml_base64), or system file:
#   macOS/Linux: /etc/codex/requirements.toml
#   Windows: %ProgramData%\OpenAI\Codex\requirements.toml
# Requires Codex rust-v0.146.0+ for exact managed value enforcement.
# Shared with Codex Desktop: one requirements.toml covers CLI and Desktop.
# For startups and individual developers  -  essential guardrails only.

# WHAT: Allows all standard approval policies including never for trusted local use.
# WHY: Baseline prioritizes developer speed while still documenting the policy surface.
# BREAKS: Narrowing this list without communication blocks existing scripts that use never.
allowed_approval_policies = ["untrusted", "on-request", "never"]

# WHAT: Blocks the unrestricted sandbox while allowing read-only and workspace-write.
# WHY: danger-full-access removes filesystem and network containment.
# BREAKS: Developers who relied on full access must redesign workflows inside workspace-write.
allowed_sandbox_modes = ["read-only", "workspace-write"]

# WHAT: Allows cached and live web search for early adoption teams.
# WHY: Startups often need live docs lookup; live search increases egress risk later.
# BREAKS: Moving to Moderate removes live search and may surprise researchers.
allowed_web_search_modes = ["cached", "live"]

# WHAT: Prefers a private Windows desktop for sandboxed child processes.
# WHY: Safer Windows default without changing day-to-day macOS or Linux workflows.
# BREAKS: Older Windows sandbox setups may need sandbox_private_desktop = false temporarily.
[windows]
sandbox_private_desktop = true

# WHAT: Pins only the highest-risk or under-development surfaces.
# WHY: Baseline keeps productivity features on while blocking computer use and preview MCP.
# BREAKS: Computer-use demos fail; enabling mcp_2026_07_28 early exposes unfinished protocol risk.
[features]
computer_use = false
enable_mcp_apps = false
mcp_2026_07_28 = false
non_prefixed_mcp_tool_names = false

# WHAT: Prompts before privilege escalation.
# WHY: Even Baseline teams should notice sudo and su attempts from the agent.
# BREAKS: Extra prompts on admin tasks; do not set forbidden unless the fleet is ready.
[rules]
prefix_rules = [
  { pattern = [{ any_of = ["sudo", "su", "doas"] }], decision = "prompt", justification = "Privilege escalation requires explicit approval." },
]
