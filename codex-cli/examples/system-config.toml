# Codex CLI — System-wide configuration
# Deploy to: /etc/codex/config.toml (Unix/Linux/macOS)
# Sets organization-wide defaults. User and project configs can override.

# Default to workspace-write with no network.
sandbox_mode = "workspace-write"

# Require approval for all operations.
approval_policy = "on-request"

# Default only. This file is /etc/codex/config.toml, and user or project config can override it.
# The non-overridable pin is cli_auth_credentials_store = "keyring" in requirements.toml
# (Moderate and Strict). Deploy that file on the system, or via macOS MDM.
# The ChatGPT cloud requirements console ignores this key.
cli_auth_credentials_store = "keyring"

# Default model.
model = "o4-mini"

# Disable network in workspace-write sandbox mode at the system level.
[sandbox_workspace_write]
network_access = false
